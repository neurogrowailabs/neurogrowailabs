  </defs>
  <rect width="32" height="32" rx="7" fill="#08080a" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="rgba(146, 129, 247, 0.35)" stroke-width="1" />
  <circle cx="16" cy="16" r="6" fill="url(#irisGlow)" filter="url(#bloom)" />
